<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
  <title>Hold Esc while connecting USB; release after RPI-RP2 appears</title>
  <defs><pattern id="keys" width="36" height="36" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="31" height="31" rx="5" fill="#faf9f6" stroke="#d6d5cf"/></pattern></defs>
  <!-- One sequence, no model-specific USB port location is implied. -->
  <rect width="280" height="300" rx="20" fill="#eeede7"/>
  <rect x="310" width="280" height="300" rx="20" fill="#fff0e7"/>
  <rect x="620" width="280" height="300" rx="20" fill="#edf2e7"/>
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <circle cx="28" cy="28" r="13" fill="white"/><text x="28" y="33" fill="#585950">1</text>
    <circle cx="338" cy="28" r="13" fill="#ff4d00"/><text x="338" y="33" fill="white">2</text>
    <circle cx="648" cy="28" r="13" fill="#6c8655"/><text x="648" y="33" fill="white">3</text>
  </g>
  <!-- Unplug: connector moves away from port. -->
  <rect x="30" y="188" width="220" height="84" rx="12" fill="#dcdad2" stroke="#c9c8bf"/>
  <rect x="40" y="199" width="200" height="62" rx="5" fill="url(#keys)"/>
  <rect x="122" y="182" width="36" height="9" rx="4" fill="#282b27"/>
  <path d="M140 50v38" stroke="#85887f" stroke-width="8" stroke-linecap="round"/>
  <rect x="125" y="87" width="30" height="35" rx="7" fill="#343833"/>
  <rect x="129" y="122" width="22" height="14" rx="3" fill="#b2b6ab" stroke="#73776e"/>
  <path d="M182 163v-37m-8 8 8-8 8 8" stroke="#ff4d00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 146v26" stroke="#9d9f95" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- Esc remains held as plug seats. -->
  <rect x="340" y="188" width="220" height="84" rx="12" fill="#dcdad2" stroke="#c9c8bf"/>
  <rect x="350" y="199" width="200" height="62" rx="5" fill="url(#keys)"/>
  <rect x="350" y="199" width="36" height="36" rx="5" fill="#ff4d00" stroke="#c93d00"/>
  <text x="368" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white">Esc</text>
  <path d="M368 160v30m-7-7 7 7 7-7" stroke="#ff4d00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="368" cy="217" r="25" stroke="#ff4d00" stroke-opacity=".28" stroke-width="3"/>
  <path d="M450 48v94" stroke="#85887f" stroke-width="8" stroke-linecap="round"/>
  <rect x="435" y="141" width="30" height="35" rx="7" fill="#343833"/>
  <rect x="439" y="176" width="22" height="13" rx="3" fill="#b2b6ab" stroke="#73776e"/>
  <path d="M491 133v35m-8-8 8 8 8-8" stroke="#ff4d00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Confirmation on computer: boot volume, not update success. -->
  <rect x="650" y="80" width="220" height="153" rx="12" fill="#fff" stroke="#d3dacb" stroke-width="2"/>
  <path d="M650 107h220" stroke="#e5e9e1"/>
  <g fill="#c5ccbd"><circle cx="666" cy="94" r="3"/><circle cx="677" cy="94" r="3"/><circle cx="688" cy="94" r="3"/></g>
  <rect x="733" y="128" width="54" height="39" rx="7" fill="#edf2e7" stroke="#8b9e7b" stroke-width="2"/>
  <path d="M743 153h23" stroke="#8b9e7b" stroke-width="3" stroke-linecap="round"/><circle cx="776" cy="153" r="2.5" fill="#6c8655"/>
  <text x="760" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#32432b">RPI-RP2</text>
  <path d="M730 249h60m-30-15v15" stroke="#b0b9a8" stroke-width="5" stroke-linecap="round"/>
</svg>
