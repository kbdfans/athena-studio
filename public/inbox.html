<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KBD Studio · 反馈收件箱</title>
    <link rel="stylesheet" href="./studio-theme.css" />
    <script src="./studio-theme.js"></script><link rel="stylesheet" href="./feedback/inbox.css"><script type="module" src="./feedback/inbox.js"></script></head><body>
<header><a href="./">KBD Studio</a><span>反馈收件箱</span><a href="/admin.html">网站后台</a><button type="button" class="theme-toggle" data-theme-toggle aria-label="暗色模式" aria-pressed="false" title="暗色模式"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7 14.2A9 9 0 0 1 9.8 3.3 9 9 0 1 0 20.7 14.2Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button></header>
<main><section id="login" hidden><span class="eyebrow">ADMIN ACCESS</span><h1>管理员登录</h1><p>使用 kbd.cool 现有的管理员账号。用户提交反馈无需登录。</p><form id="login-form"><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录收件箱</button></form></section>
<section id="inbox" hidden><div class="heading"><div><span class="eyebrow">KBD STUDIO · FEEDBACK</span><h1>用户反馈</h1><p>收集问题、还原操作，让下一版更好用。</p></div><button id="refresh">刷新</button></div>
<div class="filters"><label>状态<select id="status"><option value="">全部状态</option><option value="new">未处理</option><option value="investigating">处理中</option><option value="resolved">已解决</option></select></label><label>型号<select id="model"><option value="">全部型号</option><option value="athena75">Athena75</option><option value="athena1800">Athena1800</option><option value="other">其他型号</option></select></label><label class="search">搜索<input id="search" type="search" placeholder="问题内容、型号或编号"></label></div>
<div class="columns"><section class="list-panel"><div id="count" role="status"></div><div id="reports"></div><div class="pagination"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section><section id="detail" class="detail"><p class="empty">选择一条反馈查看详情。</p></section></div></section>
<p id="error" role="alert"></p></main></body></html>
